<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Little Artist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --sky:#BFE3FF; --ink:#1E2A5A; --sun:#FFD23F; --shade:#8FC6F2; --card:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#22305E; --ink:#F3F6FF; --shade:#15204A; --card:#2E3D72; }
}
:root[data-theme="dark"]{ --sky:#22305E; --ink:#F3F6FF; --shade:#15204A; --card:#2E3D72; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--sky);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:var(--ink);cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* ---------- library ---------- */
.screen{height:100%;overflow-y:auto;padding:20px 16px 40px}
.screen h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;margin:4px 0;text-align:center;line-height:1}
.screen p.sub{text-align:center;margin:0 0 18px;font-size:1.2rem;font-weight:600;opacity:.8}
.head{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto 14px}
.head h1{flex:1;text-align:left;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:960px;margin:0 auto}
.pick{background:var(--card);border-radius:28px;padding:10px 10px 6px;box-shadow:0 6px 0 var(--shade);
  display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.pick svg{width:100%;aspect-ratio:1;background:#fff;border-radius:20px}
.pick span{font-size:1.3rem;font-weight:800}
.pack .cover{width:100%;aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:clamp(4rem,14vw,6rem)}
#picks{display:none}

/* ---------- studio ---------- */
#studio{height:100%;display:none;flex-direction:column;padding:8px;gap:8px}
#studio.on{display:flex}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{background:var(--card);border-radius:22px;min-width:60px;height:60px;padding:0 12px;font-size:1.8rem;
  box-shadow:0 5px 0 var(--shade);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.btn small{font-size:1.05rem;font-weight:800}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shade)}
.btn.sel{background:var(--sun);color:#1E2A5A;box-shadow:0 5px 0 #C99A00}
.btn[hidden]{display:none}
.spacer{flex:1}
.group{display:flex;gap:6px;background:color-mix(in srgb,var(--card) 35%,transparent);padding:5px;border-radius:26px}
#work{flex:1;display:flex;gap:10px;min-height:0;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:1;height:100%;max-width:100%;max-height:100%}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:26px}
#paint{background:#fff;touch-action:none;box-shadow:0 8px 0 var(--shade)}
#guide{pointer-events:none}
.palette{display:grid;grid-template-columns:repeat(2,54px);gap:10px;align-content:center}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 var(--shade);transition:transform .1s}
.sw.sel{transform:scale(1.18);border-color:var(--ink)}
.sizes{display:flex;flex-direction:column;gap:10px;align-items:center}
.dot{width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--shade);display:flex;align-items:center;justify-content:center}
.dot i{display:block;border-radius:50%;background:var(--ink)}
.dot.sel{background:var(--sun)}
.dot.sel i{background:#1E2A5A}
@media (orientation:portrait){
  #work{flex-direction:column}
  #stage{height:auto;width:100%}
  .palette{grid-template-columns:repeat(6,44px);gap:8px}
  .sw{width:44px;height:44px}
  .sizes{flex-direction:row}
  .side{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
}
@media (orientation:landscape){ .side{display:contents} }
.burst{position:fixed;font-size:3rem;pointer-events:none;animation:fly 1.3s ease-out forwards;z-index:9}
.pop{position:fixed;font-size:2.2rem;pointer-events:none;animation:pop .9s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(1.4);opacity:0}}
@keyframes pop{0%{transform:scale(.3)}40%{transform:scale(1.4)}100%{transform:translateY(-50px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst,.pop{animation-duration:.01s}}
</style>
</head>
<body>

<section id="packs" class="screen">
  <h1>Little Artist</h1>
  <p class="sub">Pick a world!</p>
  <div class="grid" id="pack-grid"></div>
</section>

<section id="picks" class="screen">
  <div class="head">
    <button class="btn" id="back-packs" aria-label="Back to worlds">⬅️</button>
    <h1 id="pack-title"></h1>
  </div>
  <div class="grid" id="pick-grid"></div>
</section>

<section id="studio">
  <div class="bar">
    <button class="btn" id="home" aria-label="Back to pictures">⬅️</button>
    <div class="group">
      <button class="btn" id="m-trace" aria-label="Trace mode">✏️<small>Trace</small></button>
      <button class="btn" id="m-color" aria-label="Color mode">🎨<small>Color</small></button>
      <button class="btn" id="m-match" aria-label="Match the colors mode">🎯<small>Match</small></button>
    </div>
    <div class="group" id="tools"></div>
    <button class="btn" id="undo" aria-label="Undo">↩️</button>
    <button class="btn" id="clear" aria-label="Start over">🗑️</button>
    <button class="btn" id="done" aria-label="All done">⭐</button>
  </div>
  <div id="work">
    <div class="side"><div class="palette" id="palette"></div></div>
    <div id="stage"><canvas id="paint"></canvas><canvas id="guide"></canvas></div>
    <div class="side"><div class="sizes" id="sizes"></div></div>
  </div>
</section>

/* ---------- library ---------- */
const $=id=>document.getElementById(id);
function show(id){["packs","picks"].forEach(s=>$(s).style.display=s===id?"block":"none");$("studio").classList.toggle("on",id==="studio");}
function thumb(d,dashed){const st=`fill="none" stroke="#1E2A5A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" ${dashed?'stroke-dasharray="14 18"':''}`;
  const txt=d.text?`<text x="200" y="${d.ty}" font-size="${d.fs}" font-weight="800" font-family="'Baloo 2',sans-serif" text-anchor="middle" dominant-baseline="central" ${st.replace('stroke-width="10"','stroke-width="6"')}>${d.text}</text>`:"";
  return `<svg viewBox="0 0 400 400" aria-hidden="true">${d.path?`<path d="${d.path}" ${st}/>`:""}${txt}</svg>`;}
let curPack=null;
for(const pk of PACKS){
  const b=document.createElement("button");b.className="pick pack";
  b.innerHTML=`<div class="cover" style="background:${pk.bg}">${pk.emoji}</div><span>${pk.name}</span>`;
  b.onclick=()=>openPack(pk); $("pack-grid").appendChild(b);
}
function openPack(pk){
  curPack=pk; $("pack-title").textContent=pk.emoji+" "+pk.name; const g=$("pick-grid"); g.innerHTML="";
  for(const d of pk.items){const b=document.createElement("button");b.className="pick";b.innerHTML=thumb(d,d.mode==="trace")+`<span>${d.name}</span>`;b.onclick=()=>openDrawing(d);g.appendChild(b);}
  show("picks"); $("picks").scrollTop=0;
}
$("back-packs").onclick=()=>show("packs");
$("home").onclick=()=>{clearInterval(sprayTimer);show("picks");};

const bctx=barrier.getContext("2d",{willReadFrequently:true});
let cur=null,mode="color",tool="crayon",color=RED,size=22,undoStack=[],hintsDone=[],hue=0;

const TOOLS=[["crayon","🖍️","Crayon"],["rainbow","🌈","Rainbow brush"],["glitter","✨","Glitter brush"],["spray","💨","Spray paint"],["fill","🪣","Paint bucket"],["erase","🧽","Eraser"]];
for(const [id,ic,label] of TOOLS){const b=document.createElement("button");b.className="btn";b.id="t-"+id;b.textContent=ic;b.setAttribute("aria-label",label);b.onclick=()=>setTool(id);$("tools").appendChild(b);}

COLORS.forEach((c,i)=>{const b=document.createElement("button");b.className="sw"+(i?"":" sel");b.style.background=c;b.setAttribute("aria-label","color "+c);
  b.onclick=()=>{color=c;$("palette").querySelectorAll(".sw").forEach(x=>x.classList.toggle("sel",x===b));if(tool==="erase"||tool==="rainbow")setTool(mode==="match"?"fill":"crayon");};$("palette").appendChild(b);});
[10,22,40].forEach((s,i)=>{const b=document.createElement("button");b.className="dot"+(i===1?" sel":"");b.setAttribute("aria-label","brush size "+(i+1));
  b.innerHTML=`<i style="width:${8+i*12}px;height:${8+i*12}px"></i>`;
  b.onclick=()=>{size=s;$("sizes").querySelectorAll(".dot").forEach(x=>x.classList.toggle("sel",x===b));};$("sizes").appendChild(b);});

function setTool(t){tool=t;TOOLS.forEach(([x])=>$("t-"+x).classList.toggle("sel",x===t));}
function setMode(m){mode=m;["trace","color","match"].forEach(x=>$("m-"+x).classList.toggle("sel",x===m));if(m==="match")setTool("fill");drawGuide();}
$("m-trace").onclick=()=>{setMode("trace");setTool("crayon");};
$("m-color").onclick=()=>setMode("color");
$("m-match").onclick=()=>setMode("match");

function drawGuide(){
  g.clearRect(0,0,S,S);bctx.clearRect(0,0,S,S);
  if(!cur||(!cur.path&&!cur.text))return;
  const path=new Path2D(cur.path||"");
  for(const [ctx,trace] of [[g,mode==="trace"],[bctx,false]]){
    ctx.save();ctx.scale(K,K);ctx.lineCap="round";ctx.lineJoin="round";
    if(trace){ctx.strokeStyle="rgba(90,110,170,.55)";ctx.lineWidth=4;ctx.setLineDash([7,10]);}
    else{ctx.strokeStyle="#1E2A5A";ctx.lineWidth=ctx===bctx?4.4:3.6;ctx.setLineDash([]);}
    ctx.stroke(path);
    if(cur.text){ctx.font=`800 ${cur.fs}px "Baloo 2", sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.strokeText(cur.text,200,cur.ty);}
    ctx.restore();
  }
  if(mode==="match"&&cur.hints){
    cur.hints.forEach(([x,y,c],i)=>{ if(hintsDone[i])return;
      g.beginPath();g.arc(x*K,y*K,15,0,Math.PI*2);g.fillStyle=c;g.fill();
      g.lineWidth=5;g.strokeStyle=c===WHITE?"#9AA5B1":"#fff";g.stroke();
      g.beginPath();g.arc(x*K,y*K,20,0,Math.PI*2);g.lineWidth=2;g.strokeStyle="#1E2A5A";g.stroke();
    });
  }
}

function openDrawing(d){
  cur=d;undoStack=[];hintsDone=(d.hints||[]).map(()=>false);
  p.fillStyle="#fff";p.fillRect(0,0,S,S);
  $("m-match").hidden=!d.hints;
  setMode(d.mode||"color");
  setTool(d.mode==="trace"||!d.path?"crayon":"fill");
  show("studio");
}

function pushUndo(){undoStack.push({img:p.getImageData(0,0,S,S),hints:hintsDone.slice()});if(undoStack.length>15)undoStack.shift();}
$("undo").onclick=()=>{const u=undoStack.pop();if(u){p.putImageData(u.img,0,0);hintsDone=u.hints;drawGuide();}};
$("clear").onclick=()=>{pushUndo();p.fillStyle="#fff";p.fillRect(0,0,S,S);hintsDone=hintsDone.map(()=>false);drawGuide();};

/* ---------- brushes ---------- */
let drawing=false,last=null,sprayTimer=null;
function pos(e){const r=paint.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height};}
function line(a,b,style,w){p.strokeStyle=style;p.lineWidth=w;p.lineCap="round";p.lineJoin="round";p.beginPath();p.moveTo(a.x,a.y);p.lineTo(b.x,b.y);p.stroke();}
function spray(q){
  p.fillStyle=color;const r=size*2;
  for(let i=0;i<size*1.6;i++){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r;p.fillRect(q.x+Math.cos(a)*d,q.y+Math.sin(a)*d,2.5,2.5);}
}
function sparkle(x,y,r,c){p.fillStyle=c;p.beginPath();p.moveTo(x,y-r);p.quadraticCurveTo(x,y,x+r,y);p.quadraticCurveTo(x,y,x,y+r);p.quadraticCurveTo(x,y,x-r,y);p.quadraticCurveTo(x,y,x,y-r);p.fill();}
function glitter(a,b){
  line(a,b,color,size*.7);
  const n=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)/6);
  for(let i=0;i<n;i++){const t=Math.random(),x=a.x+(b.x-a.x)*t+(Math.random()-.5)*size*1.4,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*size*1.4;
    const c=["#FFFFFF","#FFF6A8",color,"#FFD23F"][Math.random()*4|0];
    if(Math.random()<.25)sparkle(x,y,3+Math.random()*size*.35,c);else{p.fillStyle=c;p.beginPath();p.arc(x,y,1.5+Math.random()*2,0,6.283);p.fill();}}
}
function paintSeg(a,b){
  if(tool==="crayon")line(a,b,color,size);
  else if(tool==="erase")line(a,b,"#fff",size*1.6);
  else if(tool==="rainbow"){hue=(hue+5)%360;line(a,b,`hsl(${hue} 90% 55%)`,size);}
  else if(tool==="glitter")glitter(a,b);
  else if(tool==="spray")spray(b);
}
paint.addEventListener("pointerdown",e=>{
  e.preventDefault();const q=pos(e);pushUndo();
  if(tool==="fill"){flood(q.x|0,q.y|0);return;}
  drawing=true;last=q;paint.setPointerCapture(e.pointerId);paintSeg(q,{x:q.x+.1,y:q.y+.1});
  if(tool==="spray"){clearInterval(sprayTimer);sprayTimer=setInterval(()=>drawing&&spray(last),35);}
});
paint.addEventListener("pointermove",e=>{if(!drawing)return;const q=pos(e);paintSeg(last,q);last=q;});
["pointerup","pointercancel"].forEach(t=>paint.addEventListener(t,()=>{drawing=false;clearInterval(sprayTimer);}));

/* ---------- fill + matching ---------- */
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function flood(x,y){
  if(x<0||y<0||x>=S||y>=S){undoStack.pop();return;}
  const img=p.getImageData(0,0,S,S),d=img.data,bar=bctx.getImageData(0,0,S,S).data;
  const st=y*S+x;if(bar[st*4+3]>90){undoStack.pop();return;}
  const tr=d[st*4],tg=d[st*4+1],tb=d[st*4+2],[fr,fg,fb]=hexRgb(color);
  const same=Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb)<12;
  const filled=new Uint8Array(S*S),seen=new Uint8Array(S*S),stack=[st],tol=110;
  while(stack.length){
    const i=stack.pop();if(seen[i])continue;seen[i]=1;
    const o=i*4;if(bar[o+3]>90)continue;
    if(Math.abs(d[o]-tr)+Math.abs(d[o+1]-tg)+Math.abs(d[o+2]-tb)>tol)continue;
    filled[i]=1;d[o]=fr;d[o+1]=fg;d[o+2]=fb;d[o+3]=255;
    const px=i%S;
    if(px>0)stack.push(i-1);if(px<S-1)stack.push(i+1);
    if(i>=S)stack.push(i-S);if(i<S*S-S)stack.push(i+S);
  }
  if(!same)p.putImageData(img,0,0);
  checkHints(filled);
}
function checkHints(filled){
  if(mode!=="match"||!cur.hints)return;
  let changed=false;
  cur.hints.forEach(([x,y,c],i)=>{
    const idx=Math.round(y*K)*S+Math.round(x*K);
    if(!filled[idx])return;
    const ok=c===color;
    if(ok&&!hintsDone[i]){hintsDone[i]=true;changed=true;popAt(x,y,"⭐");}
    else if(!ok&&hintsDone[i]){hintsDone[i]=false;changed=true;}
  });
  if(changed){drawGuide();if(hintsDone.every(Boolean))setTimeout(celebrate,450);}
}

/* ---------- celebrations ---------- */
function popAt(x,y,ch){
  const r=paint.getBoundingClientRect(),s=document.createElement("div");
  s.className="pop";s.textContent=ch;s.style.left=(r.left+x/400*r.width-18)+"px";s.style.top=(r.top+y/400*r.height-24)+"px";
  document.body.appendChild(s);setTimeout(()=>s.remove(),950);
}
function celebrate(){
  const r=$("stage").getBoundingClientRect();
  for(let i=0;i<18;i++){
    const s=document.createElement("div");s.className="burst";s.textContent=["⭐","🌟","✨","🎉","💖"][i%5];
    s.style.left=(r.left+r.width/2-24)+"px";s.style.top=(r.top+r.height/2-24)+"px";
    const a=Math.random()*Math.PI*2,dist=150+Math.random()*200;
    s.style.setProperty("--dx",Math.cos(a)*dist+"px");s.style.setProperty("--dy",Math.sin(a)*dist+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1400);
  }
}
$("done").onclick=celebrate;
document.fonts&&document.fonts.load('800 100px "Baloo 2"').then(()=>{if(cur)drawGuide();}).catch(()=>{});
</script>
</body>
</html>
